name = "Thomson"
defaultTargets = ["Thomson"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

# The main development, in reading order (`organisation.md`): the problem, the antiprism, the LP
# bounds, the three-point bound, the certificate, the shared numerics, uniqueness, `Main`.  The
# expensive kernel-checked certificates below are separate libraries and are *not* built by
# default; `Complete` (`lake build Complete`) builds them all.  Never `lake build` those libraries
# directly on a laptop: this Lake has no jobs limit and a kernel check takes 2–13 GB — use
# `scripts/kernel_build/build_all.sh`, which throttles by memory.
[[lean_lib]]
name = "Thomson"
leanOptions = { autoImplicit = false }
globs = ["Thomson", "Thomson.Basic.+", "Thomson.Antiprism.+", "Thomson.LP.+", "Thomson.ThreePoint.+",
         "Thomson.Certificate.+", "Thomson.Numerics.+", "Thomson.Uniqueness.+", "Thomson.Main"]

# The pivot system: `pivotMatrix` invertible and the pivots enclosed to `2·10⁻²¹` (F(i)).
[[lean_lib]]
name = "Pivots"
leanOptions = { autoImplicit = false }
srcDir = "."
globs = ["Thomson.Pivots.+"]

# Positive semidefiniteness of the certificate's blocks (F(ii)).  `decide +kernel`.
[[lean_lib]]
name = "PSD"
leanOptions = { autoImplicit = false }
srcDir = "."
globs = ["Thomson.PSD.+"]

# The pair inequality (F(iii)).  `decide +kernel`.
[[lean_lib]]
name = "Pair"
leanOptions = { autoImplicit = false }
srcDir = "."
globs = ["Thomson.Pair.+"]

# The triangle inequality near the five touching types (F(iv-a)): the calculus and the
# kernel-checked patch coverings.  Imported by `Thomson.Certificate.Assemble`.
[[lean_lib]]
name = "TriangleLocal"
leanOptions = { autoImplicit = false }
srcDir = "."
globs = ["Thomson.TriangleLocal.+"]

# The triangle inequality away from the touching types (F(iv-b)): the box covering, some 30
# CPU-hours of `decide +kernel` in 637 generated modules (`Covering/Part*.lean`).
[[lean_lib]]
name = "TriangleGlobal"
leanOptions = { autoImplicit = false }
srcDir = "."
globs = ["Thomson.TriangleGlobal.+"]

# The main theorems with every certificate discharged (`Thomson.Complete`).  No `native_decide`.
[[lean_lib]]
name = "Complete"
leanOptions = { autoImplicit = false }
srcDir = "."
roots = ["Thomson.Complete"]

[[lean_lib]]
name = "Thomson8"
leanOptions = { autoImplicit = false }

# Comparator (https://github.com/leanprover/comparator): `Challenge` states the theorems with
# `sorry` and imports only definitions; `Solution` proves them.  `scripts/comparator/run.sh`.
[[lean_lib]]
name = "Challenge"
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "Solution"
leanOptions = { autoImplicit = false }
