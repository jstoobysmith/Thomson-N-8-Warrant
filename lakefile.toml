name = "Thomson"
defaultTargets = ["Thomson"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

# The main development.  The globs are listed rather than `Thomson.+` so that `Thomson.Tri5b.*`
# — Task 5b, an hour of `native_decide` — is *not* part of the default build; it is the `Tri5b`
# library below, built on demand.  A new file in `Thomson/ThreePoint/` is picked up by the last
# glob; a new file directly in `Thomson/` has to be added here.
[[lean_lib]]
name = "Thomson"
leanOptions = { autoImplicit = false }
globs = ["Thomson", "Thomson.Antiprism", "Thomson.Basic", "Thomson.Cube", "Thomson.Derivative",
         "Thomson.Enclosure", "Thomson.ForceBalance", "Thomson.Main", "Thomson.Reduction",
         "Thomson.Separation", "Thomson.Yudin", "Thomson.ThreePoint.+",
         "Thomson.Unique.+"]

# Task 5b: proved, but its certificate costs about an hour of `native_decide` spread over 107
# modules, so it is kept out of `defaultTargets`.  `lake build Tri5b` checks it.
[[lean_lib]]
name = "Tri5b"
leanOptions = { autoImplicit = false }
srcDir = "."
roots = ["Thomson.Tri5b.Task5b"]

# Task 1b (and Task 1a, which its estimate proves on the way): also `native_decide`, also kept
# out of the default build.
[[lean_lib]]
name = "Task1b"
leanOptions = { autoImplicit = false }
srcDir = "."
roots = ["Thomson.Task1b.Tasks"]

# Task 4 (the pair inequality): `decide +kernel` only, no `native_decide`.  `lake build Pair`.
[[lean_lib]]
name = "Pair"
leanOptions = { autoImplicit = false }
srcDir = "."
globs = ["Thomson.Pair.+"]

# Task 2 (positive semidefiniteness): `decide +kernel` only, no `native_decide`.  `lake build PSD`.
[[lean_lib]]
name = "PSD"
leanOptions = { autoImplicit = false }
srcDir = "."
globs = ["Thomson.PSD.+"]

# Task 5a, numeric side (the patch covering and the enclosures): `decide +kernel` only.
[[lean_lib]]
name = "TriLocalCert"
leanOptions = { autoImplicit = false }
srcDir = "."
globs = ["Thomson.TriLocalCert.+"]

# The main theorem with Tasks 1a, 1b, 5b discharged (`Thomson.Complete`): builds `Task1b` and
# `Tri5b`.  `lake build Complete`.
[[lean_lib]]
name = "Complete"
leanOptions = { autoImplicit = false }
srcDir = "."
roots = ["Thomson.Complete"]

[[lean_lib]]
name = "Thomson8"
leanOptions = { autoImplicit = false }
